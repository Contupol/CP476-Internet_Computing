<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Easy Budget</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center;">
    <section>
        <div>
            <img src="images/budget.png" style="width: 10%; margin-bottom: 30px;">
        </div>
    </section>
    <section>
        <form method="POST" id="signup-form" style="border: 3px solid black; border-radius: 15px; width: 30%; display: block; margin-left: auto; margin-right: auto;">
            <H1><strong>Easy Budget Account Creation</strong></H1>
            <hr style="width: 100%; border: 1px solid black; margin: 0;">

            <div class="form-group">
                <label for="fname">Enter your first name:</label>
                <input type="text" id="fname" name="fname">

                <label for="lname">Enter your last name:</label>
                <input type="text" id="lname" name="lname">

                <label for="email">Enter your email:</label>
                <input type="email" id="email" name="email">

                <label for="userPassword">Password:</label>
                <input type="password" id="userPassword" name="password">

                <label for="userPasswordc">Confirm password:</label>
                <input type="password" id="userPasswordc" name="passwordc">

                <input formaction="/register" class="button" type="submit" style="background-color:rgb(5, 5, 103); width: 46%; align-self: center;" value="Create account"/>

                <a href="/" class="sign-up-txt" style="align-self: center;">Already have an account?</a>
            </div>
        </form>
    </section>
</body>
</html>
